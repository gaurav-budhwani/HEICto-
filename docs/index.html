<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEICto- — Professional Image Converter</title>
  <meta name="description" content="Minimal, lossless HEIC to PNG, JPG, and WebP converter with Apple ColorSync color fidelity.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <!-- Client-side libraries for static deployments (GitHub Pages / Vercel / Netlify) -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Minimalist Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <path d="M21 15l-5-5L5 21"></path>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-title">HEICto-</span>
        </div>
      </div>

      <div class="header-tools">
        <div class="engine-indicator" id="engineStatus" title="Apple ColorSync color management active">
          <span class="pulse-dot"></span>
          <span class="engine-label">ColorSync sRGB</span>
        </div>

        <button type="button" class="icon-button" id="themeToggle" aria-label="Toggle visual theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Minimalist Controls Bar -->
      <section class="controls-bar" aria-label="Conversion settings">
        <div class="control-group">
          <span class="control-label">Format</span>
          <div class="segmented-control" id="formatSegmented" role="radiogroup">
            <button type="button" class="segment-btn active" data-format="png" role="radio" aria-checked="true">PNG</button>
            <button type="button" class="segment-btn" data-format="jpeg" role="radio" aria-checked="false">JPG</button>
            <button type="button" class="segment-btn" data-format="webp" role="radio" aria-checked="false">WebP</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label" for="colorProfileSelect">Color Space</label>
          <select id="colorProfileSelect" class="minimal-select" title="Color management option">
            <option value="srgb" selected>sRGB (Web Optimized)</option>
            <option value="preserve">Display P3 (Original)</option>
          </select>
        </div>

        <div class="control-group quality-group" id="qualityGroup">
          <div class="label-with-value">
            <span class="control-label">Quality</span>
            <span class="control-value" id="qualityLabel">100%</span>
          </div>
          <input type="range" id="qualitySlider" class="minimal-slider" min="75" max="100" value="100" step="1">
        </div>

        <div class="control-group">
          <label class="control-label" for="dimensionSelect">Scale</label>
          <select id="dimensionSelect" class="minimal-select">
            <option value="0" selected>Original Size</option>
            <option value="3840">Max 4K (3840px)</option>
            <option value="2560">Max 2K (2560px)</option>
            <option value="1920">Max 1080p</option>
          </select>
        </div>
      </section>

      <!-- Minimal Drop Area -->
      <section class="drop-zone-wrapper">
        <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Dropzone for HEIC images">
          <input type="file" id="fileInput" multiple accept=".heic,.heif,.heics,.avif,.png,.jpg,.jpeg,.webp,.tiff,.dng" class="sr-only">
          
          <div class="drop-prompt">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <p class="primary-prompt">
              <strong>Drop your iPhone HEIC photos here</strong>, or <span class="highlight-action">browse</span>
            </p>
            <p class="secondary-prompt">
              Preserves true colors & 100% resolution • Press <kbd>⌘V</kbd> to paste
            </p>
          </div>
        </div>
      </section>

      <!-- Conversion Queue Table -->
      <section class="queue-section" id="queueSection" style="display: none;">
        <div class="queue-header">
          <div class="queue-meta">
            <span class="queue-title">Queue</span>
            <span class="queue-count" id="queueCount">0 items</span>
          </div>
          <div class="queue-actions">
            <button type="button" class="btn-ghost" id="clearBtn">Clear</button>
            <button type="button" class="btn-solid" id="zipBtn" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Download All (ZIP)</span>
            </button>
          </div>
        </div>

        <!-- Linear Progress Indicator -->
        <div class="linear-progress" id="linearProgress" style="display: none;">
          <div class="linear-progress-bar" id="linearProgressBar"></div>
        </div>

        <!-- Cards List -->
        <div class="queue-list" id="queueList"></div>
      </section>
    </main>

    <!-- Floating Batch Summary Bar (Appears when completed items exist) -->
    <aside class="floating-bar" id="floatingBar" style="display: none;">
      <div class="floating-content">
        <div class="floating-info">
          <span class="check-glyph">✓</span>
          <span id="floatingSummaryText">0 converted</span>
        </div>
        <div class="floating-actions">
          <button type="button" class="floating-btn-ghost" id="floatingClearBtn">Clear</button>
          <button type="button" class="floating-btn-primary" id="floatingZipBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Download All (.zip)</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Native Accessible Dialog (Conforming to modern-web-guidance) -->
    <dialog id="previewModal" closedby="any" aria-labelledby="modalTitle">
      <div class="modal-inner">
        <header class="modal-top">
          <h2 id="modalTitle" class="modal-heading">Image Inspection</h2>
          <form method="dialog">
            <button type="submit" class="modal-close-btn" aria-label="Close dialog">&times;</button>
          </form>
        </header>

        <div class="modal-view">
          <div class="modal-img-wrap">
            <img id="modalPreviewImg" src="" alt="Full preview" class="modal-img">
          </div>
          <div class="modal-meta-grid" id="modalMetaGrid"></div>
        </div>

        <footer class="modal-bottom">
          <form method="dialog">
            <button type="submit" class="btn-ghost">Done</button>
          </form>
          <a id="modalDownloadLink" href="#" download class="btn-solid">Download Image</a>
        </footer>
      </div>
    </dialog>

    <!-- Minimalist Footer -->
    <footer class="app-footer">
      <div class="footer-inner">
        <span>Runs locally or anywhere in the cloud • 100% Private</span>
        <span class="bullet">•</span>
        <span>Apple ColorSync Engine</span>
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
